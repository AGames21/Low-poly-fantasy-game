name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/knight-game-ui-21z6fr]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: touch dist/.nojekyll
      # Publishes dist/ to the gh-pages branch, which GitHub Pages serves.
      # (The official pages actions need the Pages API, which the workflow
      # token isn't allowed to use on this repo.)
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
